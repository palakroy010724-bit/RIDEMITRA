<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <title>SignUp</title>
</head>
<body>
    <div class="left-content">
  <h1>Start Your Journey With Us</h1>
  <p>
    Join RideMitra and experience smarter commuting.
    Post rides, Find rides and travel better every day.
  </p>
</div>
    <div class="container2">
        <div><button class="back-btn" onclick="window.open('login.html')" onclick="showLogin()"><ion-icon name="arrow-back-circle"></ion-icon></ion-icon></button></div>
            <div class="header_2">
            <h2>Create a new account</h2>
        </div>
        <hr>
        <div class="roles">
        <button onclick="selectRole('driver')" id="driverBtn" class="role-btn">Post Ride <ion-icon name="car-sport"></ion-icon></ion-icon></button>
        <button onclick="selectRole('passenger')" id="passengerBtn" class="role-btn">Find Ride <ion-icon name="search"></ion-icon></button>
        </div>
        <div>
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Enter Password">
        </div> 
        <div><button class="signup-btn" onclick="signup()">Sign Up</button></div>
        </div>    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="login.js"></script>
</body>
</html>
